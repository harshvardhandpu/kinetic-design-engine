<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Dock Mosaic — Yard Plate</title>
  <meta name="description" content="An original industrial mosaic that docks one cell's reading.">
  <meta data-kinetic-capture-ready="true" content="local-v2-ready">
  <style>
    :root {
      color-scheme: dark;
      --plate: #121412;
      --ink: #e7f0d8;
      --ink-soft: #8b9778;
      --lime: #c6f04c;
      --cell: #1b1e18;
      --line: rgba(198, 240, 76, .28);
      --kinetic-duration-fast: 150ms;
      --kinetic-duration-med: 300ms;
      --kinetic-duration-slow: 450ms;
      --kinetic-easing-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --kinetic-easing-snap: cubic-bezier(0.2, 0, 0, 1);
      --kinetic-distance-reveal-y: 24px;
      --kinetic-opacity-hidden: 0;
      --kinetic-opacity-visible: 1;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; min-width: 320px; background: var(--plate); color: var(--ink);
      font: 15px/1.45 ui-sans-serif, system-ui, sans-serif;
    }
    button { font: inherit; color: inherit; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
    .wrap { width: min(1160px, calc(100% - 32px)); margin-inline: auto; }
    header {
      display: flex; justify-content: space-between; align-items: flex-end; gap: 16px;
      padding: 32px 0 18px; border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 4rem); letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
    #menuToggle { display: none; }
    .mosaic {
      display: grid; grid-template-columns: repeat(12, 1fr); gap: 10px; padding: 22px 0 48px;
    }
    .cell {
      background: var(--cell); border: 1px solid var(--line); min-height: 160px; padding: 16px;
      text-align: left; cursor: pointer;
    }
    .cell:first-of-type { grid-column: span 8; min-height: 220px; }
    .cell:nth-of-type(2) { grid-column: span 4; }
    .cell:nth-of-type(n+3) { grid-column: span 4; }
    .cell small { display: block; color: var(--ink-soft); letter-spacing: .08em; text-transform: uppercase; font-size: 11px; }
    .dock {
      grid-column: 9 / span 4; grid-row: 1;
      background: #15180f; border: 1px solid var(--lime); padding: 16px;
      transform: translateX(var(--kinetic-distance-reveal-y));
      opacity: var(--kinetic-opacity-hidden);
      transition: transform var(--kinetic-duration-slow) var(--kinetic-easing-out-expo), opacity var(--kinetic-duration-slow) var(--kinetic-easing-out-expo);
    }
    .mosaic:has(#signature-cell:hover) .cell:first-of-type,
    .mosaic:has(#signature-cell:focus-visible) .cell:first-of-type { border-color: var(--lime); }
    .mosaic:has(#signature-cell:hover) .dock,
    .mosaic:has(#signature-cell:focus-visible) .dock {
      transform: translateX(0); opacity: var(--kinetic-opacity-visible);
    }
    .notes { padding-bottom: 72px; color: var(--ink-soft); min-height: 720px; }
    .return-plate { padding-bottom: 48px; }
    @media (max-width: 800px) {
      #menuToggle { display: inline-block; background: none; border: 1px solid var(--line); padding: 8px 12px; }
      .cell, .cell:first-of-type, .cell:nth-of-type(2), .cell:nth-of-type(n+3), .dock { grid-column: 1 / -1; }
      .menu { display: none; }
      body.menu-open .menu { display: block; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition: none !important; animation: none !important; }
      .dock { transform: none; opacity: var(--kinetic-opacity-visible); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header data-kinetic="yard-header" data-kinetic-version="0.1">
      <h1 id="page-title">Dock Mosaic</h1>
      <p>6 plates live</p>
      <button id="menuToggle" type="button" aria-label="Open cell list">Cells</button>
    </header>
    <ul class="menu" hidden>
      <li>North Hatch</li><li>Lime Rule</li><li>Slab Four</li>
    </ul>
    <section class="mosaic" data-kinetic="mosaic-plate" data-kinetic-version="0.1">
      <button class="cell" id="signature-cell" type="button"><small>01</small>North Hatch</button>
      <aside class="dock" id="dock">North Hatch keeps its plate. The dock is the reading, not a new page.</aside>
      <button class="cell" type="button"><small>02</small>Lime Rule</button>
      <button class="cell" type="button"><small>03</small>Slab Four</button>
      <button class="cell" type="button"><small>04</small>Wet Gauge</button>
      <button class="cell" type="button"><small>05</small>Night Crate</button>
      <button class="cell" type="button"><small>06</small>End Bolt</button>
    </section>
    <section class="notes" id="notes" data-kinetic="yard-notes" data-kinetic-version="0.1">
      <h2>Yard notes</h2>
      <p>Unequal cells stay in place. Docking is the original interaction; no source mosaic or documentation shell is copied.</p>
    </section>
    <p class="return-plate"><a id="backTop" href="#page-title">Return to plate</a></p>
  </div>
  <script>
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
    const menu = document.querySelector('.menu');
    document.getElementById('menuToggle').addEventListener('click', () => {
      document.body.classList.toggle('menu-open');
      menu.hidden = !document.body.classList.contains('menu-open');
    });
    document.getElementById('backTop').addEventListener('click', (event) => {
      event.preventDefault();
      document.getElementById('page-title').focus();
      window.scrollTo({ top: 0, behavior: reduce.matches ? 'auto' : 'smooth' });
    });
  </script>
</body>
</html>
